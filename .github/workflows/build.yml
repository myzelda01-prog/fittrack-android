name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    # The kivy/buildozer:latest image ships Python 3.14, whose bundled pip
    # is incompatible with python-for-android's venv setup
    # (ImportError: BuildDependencyInstallError). So we build our own
    # image based on Ubuntu 22.04 with Python 3.11 + Buildozer + everything
    # Buildozer needs, then run the build inside it via docker run.
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build custom Buildozer image (cached between runs)
        run: |
          docker build \
            --cache-from fittrack-buildozer:latest \
            --tag fittrack-buildozer:latest \
            --file Dockerfile \
            .

      - name: Build APK in container
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            --env GRADLE_OPTS="-Xmx2g -Dorg.gradle.daemon=false" \
            fittrack-buildozer:latest \
            bash -c "yes | buildozer -v android debug 2>&1 | tee build.log"

      - name: Find APK output
        id: locate
        run: |
          set -e
          APK=$(find ./bin -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found in ./bin"
            ls -la ./bin 2>&1 || true
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK at: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-debug-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7