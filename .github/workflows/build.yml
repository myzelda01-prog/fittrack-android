name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    # Use the official kivy/buildozer:latest image. It has Python 3.14,
    # buildozer 1.5.0, OpenJDK 17, Android SDK + NDK, and licenses
    # pre-accepted. python3 is left unpinned so it matches p4a's
    # hostpython3 (both are 3.14) — that was the version-mismatch
    # blocker with our custom Ubuntu image.
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install liblzma-dev (needed by Python's _lzmamodule)
        run: apt-get update && apt-get install -y --no-install-recommends liblzma-dev && rm -rf /var/lib/apt/lists/*

      # p4a hardcodes Pillow==11.3.0 in its pymodules install code, but
      # 11.3.0 has no Python 3.14 wheels (pip can't find a matching
      # distribution). We pre-clone p4a, sed the version, and tell
      # buildozer to use the patched copy via p4a.source_dir.
      - name: Clone + patch python-for-android
        run: |
          set -e
          git clone --depth 1 --branch master \
            https://github.com/kivy/python-for-android.git /opt/p4a-patched
          # Bump p4a's hardcoded Pillow to 11.4.0+ which has 3.14 wheels
          sed -i 's/Pillow==11\.3\.0/Pillow==11.4.0/g' /opt/p4a-patched/pythonforandroid/build.py
          # Pin Cython below 3 because p4a's vendored pyjnius uses the
          # deprecated Cython `IF` statement removed in Cython 3
          sed -i 's/"cython>=0\.29\.19"/"cython<3.0"/g' /opt/p4a-patched/pythonforandroid/bootstraps/sdl2/dependencies.py || true
          sed -i 's/"cython>=0\.29"/"cython<3.0"/g' /opt/p4a-patched/pythonforandroid/bootstraps/sdl2/dependencies.py || true
          sed -i 's/"cython"/"cython<3.0"/g' /opt/p4a-patched/pythonforandroid/bootstraps/sdl2/dependencies.py || true
          # Verify the patch landed
          grep -n 'Pillow==' /opt/p4a-patched/pythonforandroid/build.py || true
          grep -n 'cython' /opt/p4a-patched/pythonforandroid/bootstraps/sdl2/dependencies.py || true
          echo "p4a source dir: /opt/p4a-patched"

      - name: Tell buildozer to use the patched p4a
        run: |
          # Add p4a.source_dir to the spec so buildozer uses our patched copy
          # instead of cloning its own.
          if ! grep -q '^p4a.source_dir' buildozer.spec; then
            echo '' >> buildozer.spec
            echo '# Use our pre-patched p4a' >> buildozer.spec
            echo 'p4a.source_dir = /opt/p4a-patched' >> buildozer.spec
          fi
          tail -3 buildozer.spec

      - name: Build debug APK with Buildozer
        run: |
          # Pipe 'yes' to auto-answer the root-warning prompt (image runs as root)
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Find APK output
        id: locate
        run: |
          set -e
          APK=$(find ./bin -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found in ./bin"
            ls -la ./bin 2>&1 || true
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK at: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-debug-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7