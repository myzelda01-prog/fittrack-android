name: Build Android APK

on:
  # Trigger manually from the GitHub Actions tab — useful for iterating
  # without spamming commits.
  workflow_dispatch:
  # Also rebuild on every push to main, so the artifact stays current.
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Cache the Buildozer download directory so SDK/NDK aren't redownloaded
      # every run. Speeds up subsequent builds from ~25 min to ~5-8 min.
      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .android-sdk
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-dev python3-pip python3-venv \
            build-essential ccache git \
            libffi-dev libssl-dev libsqlite3-dev \
            autoconf automake libtool pkg-config \
            unzip zip \
            openjdk-17-jdk-headless \
            libltdl-dev
          pip3 install --break-system-packages --upgrade pip
          pip3 install --break-system-packages \
            buildozer==1.5.0 \
            cython

      - name: Install Android command-line tools and accept SDK licenses
        env:
          ANDROIDSDK: ${{ github.workspace }}/.android-sdk
          ANDROID_HOME: ${{ github.workspace }}/.android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
        run: |
          set -e
          SDK="$ANDROIDSDK"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK/cmdline-tools"
          curl -fsSL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          rm tools.zip
          if [ -d cmdline-tools ]; then
            mkdir -p latest
            shopt -s dotglob nullglob
            mv cmdline-tools/* latest/ 2>/dev/null || true
            rmdir cmdline-tools || true
          fi
          export PATH="$PATH:$SDK/latest/bin"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          # Buildozer 1.5.0 expects sdkmanager at $SDK/tools/bin/sdkmanager.
          # Install the legacy "tools" package via the new cmdline-tools so
          # sdkmanager lands at the path Buildozer checks.
          yes | sdkmanager --install "tools" "platform-tools" >/dev/null 2>&1 || true
          ls "$SDK/tools/bin/" 2>&1 || true

          mkdir -p "$SDK/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n2433f8a3435a7489f644e5f1d78b16a7c9aa9b87\n' > "$SDK/licenses/android-sdk-license"

          # Buildozer uses ~/.buildozer/android/platform/android-sdk — symlink
          # to our SDK so its sdkmanager sees the same accepted licenses.
          mkdir -p "$HOME/.buildozer/android/platform"
          rm -rf "$HOME/.buildozer/android/platform/android-sdk"
          ln -s "$SDK" "$HOME/.buildozer/android/platform/android-sdk"
          ls -la "$HOME/.buildozer/android/platform/"

          echo "Android SDK ready: $SDK (symlinked into Buildozer path)"

      - name: Build debug APK with Buildozer
        env:
          ANDROIDSDK: ${{ github.workspace }}/.android-sdk
          ANDROID_HOME: ${{ github.workspace }}/.android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
          GRADLE_OPTS: "-Xmx2g -Dorg.gradle.daemon=false"
        run: |
          # Buildozer writes the APK to ./bin/ — that's what we upload.
          export PATH="$PATH:$ANDROIDSDK/latest/bin"
          buildozer -v android debug 2>&1 | tee build.log

      - name: Find APK output
        id: locate
        run: |
          set -e
          APK=$(find ./bin -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found in ./bin"
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK at: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-debug-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7