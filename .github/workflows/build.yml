name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    # Use the official kivy/buildozer:latest image. It has Python 3.14,
    # buildozer 1.5.0, OpenJDK 17, Android SDK + NDK, and licenses
    # pre-accepted. python3 is left unpinned so it matches p4a's
    # hostpython3 (both are 3.14) — that was the version-mismatch
    # blocker with our custom Ubuntu image.
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install liblzma-dev (needed by Python's _lzmamodule)
        run: apt-get update && apt-get install -y --no-install-recommends liblzma-dev && rm -rf /var/lib/apt/lists/*

      # p4a hardcodes Pillow==11.3.0 (and pyjnius==1.7.0, kivy==2.3.1)
      # in its pymodules install code, but 11.3.0 has no Python 3.14
      # wheels (pip can't find a matching distribution). Buildozer
      # 1.5.0 doesn't honour p4a.source_dir, so we have to pre-populate
      # the directory where buildozer clones p4a and patch it in place.
      - name: Pre-populate + patch python-for-android clone
        run: |
          set -e
          # The directory buildozer clones p4a into
          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          mkdir -p "$(dirname "$P4A_DIR")"
          # Clone p4a into the exact path buildozer uses
          git clone --depth 1 --branch master \
            https://github.com/kivy/python-for-android.git "$P4A_DIR"
          # Bump ALL hardcoded Pillow/pyjnius/kivy versions
          find "$P4A_DIR" -type f -name '*.py' -exec sed -i \
            -e 's/Pillow==11\.3\.0/Pillow==11.4.0/g' \
            -e 's/Pillow==11\.0\.0/Pillow==11.4.0/g' \
            -e 's/Pillow==10\.4\.0/Pillow==11.4.0/g' \
            -e 's/pyjnius==1\.7\.0/pyjnius==1.7.1/g' \
            -e 's/"kivy==2\.3\.1"/"kivy"/g' \
            {} +
          # Pin Cython below 3 because p4a's vendored pyjnius uses the
          # deprecated Cython `IF` statement removed in Cython 3
          find "$P4A_DIR" -type f -name '*.py' -exec sed -i \
            -e 's/"cython>=0\.29\.19"/"cython<3.0"/g' \
            -e 's/"cython>=0\.29"/"cython<3.0"/g' \
            -e 's/"cython"/"cython<3.0"/g' \
            -e "s/'cython'/'cython<3.0'/g" \
            {} +
          echo "=== Pillow references AFTER patch ==="
          grep -rn 'Pillow==' "$P4A_DIR" || echo "(no matches — clean)"
          echo "=== pyjnius references AFTER patch ==="
          grep -rn 'pyjnius==' "$P4A_DIR" || echo "(no matches — clean)"
          echo "=== cython references AFTER patch ==="
          grep -rn "'cython\|\"cython" "$P4A_DIR" | head -10 || echo "(no matches — clean)"

      - name: Build debug APK with Buildozer
        run: |
          # Pipe 'yes' to auto-answer the root-warning prompt (image runs as root)
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Find APK output
        id: locate
        run: |
          set -e
          APK=$(find ./bin -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found in ./bin"
            ls -la ./bin 2>&1 || true
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK at: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-debug-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7