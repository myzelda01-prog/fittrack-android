name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    # Run inside the official Kivy Buildozer image, which has Buildozer,
       # Android SDK (with licenses pre-accepted), NDK, JDK, and all required
       # system packages pre-installed. This is the Kivy team's recommended
       # CI setup and avoids the path/license quirks of installing everything
       # from scratch on a plain ubuntu-latest runner.
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:v1.5.0
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build debug APK with Buildozer
        run: |
          # The kivy/buildozer image runs as root; Buildozer prompts before
          # continuing. Pipe 'yes' to auto-answer.
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Find APK output
        id: locate
        run: |
          set -e
          APK=$(find ./bin -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found in ./bin"
            ls -la ./bin 2>&1 || true
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK at: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-debug-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7